name: Backend CI
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore tests/Salon.Domain.Tests/Salon.Domain.Tests.csproj --locked-mode
      - run: dotnet test tests/Salon.Domain.Tests/Salon.Domain.Tests.csproj -c Release --no-restore
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Salon.sln --locked-mode
      - run: dotnet build Salon.sln -c Release --no-restore
      - run: dotnet tool restore
      - name: Verify migration snapshot and generate review SQL
        env:
          ConnectionStrings__Salon: Host=localhost;Database=salon;Username=salon
        run: |
          dotnet ef migrations has-pending-model-changes --project src/Salon.Infrastructure
          dotnet ef migrations script --idempotent --project src/Salon.Infrastructure --output TestResults/migrations.sql
      - run: dotnet format Salon.sln --verify-no-changes --no-restore
      - run: dotnet test Salon.sln -c Release --no-build --logger trx --results-directory TestResults
      - run: docker build --tag salon-api:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults
